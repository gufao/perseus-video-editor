[package]
name = "perseus"
version = "2.0.0"
description = "A lightweight desktop video editor for quick cuts, trims, and exports."
authors = ["Perseus Team"]
edition = "2021"

[lib]
name = "perseus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tempfile = "3"
